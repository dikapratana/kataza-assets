<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kataza</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7fafc;
        color: #1f2937;
      }

      main {
        width: min(90vw, 640px);
        text-align: center;
      }

      img {
        width: min(180px, 48vw);
        height: auto;
        margin-bottom: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 700;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo-small.png" alt="Logo Kataza">
      <h1>Selamat datang di Kataza</h1>
    </main>
  </body>
</html>
